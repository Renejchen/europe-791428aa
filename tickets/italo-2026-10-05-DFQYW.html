<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9d002f">
<title>10/5 Italo 車票 DFQYW</title>
<style>
:root{--red:#9d002f;--ink:#202124;--sub:#5f6368;--line:#e2e5ea;--bg:#f5f6f8;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;-webkit-text-size-adjust:100%}
.top{background:var(--red);color:#fff;padding:18px 16px}
.top a{color:#fff;text-decoration:none;font-weight:700}
.wrap{max-width:560px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
h1{font-size:24px;margin:0 0 4px}.sub{font-size:15px;color:var(--sub)}
.scan{text-align:center}.scan h2{font-size:18px;margin:0 0 8px}.scan p{font-size:14px;color:var(--sub);margin:6px 0 12px}
.barcode{display:block;width:min(82vw,320px);height:min(82vw,320px);margin:0 auto;background:#fff;border:12px solid #fff}
.code{font-size:36px;font-weight:800;letter-spacing:3px;margin-top:6px}
.route{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:16px 0}
.place{font-size:18px;font-weight:800}.time{font-size:30px;font-weight:800;color:var(--red)}.arrow{font-size:28px;color:var(--sub)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:15px}.meta div{padding:9px 10px;background:var(--bg);border-radius:10px}.meta b{display:block;font-size:12px;color:var(--sub)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{flex:1;min-width:150px;text-align:center;padding:13px;border-radius:11px;background:var(--red);color:#fff;text-decoration:none;font-weight:800}.btn.alt{background:#4c566a}
.full{width:100%;height:auto;display:block;background:#fff}.note{font-size:14px;color:var(--sub);margin-top:10px}
</style>
</head>
<body>
<header class="top"><a href="../index.html#d2026-10-05">← 回 10/5 行程</a></header>
<main class="wrap">
  <section class="card scan">
    <h1>Italo 8919 車票</h1>
    <div class="sub">2026/10/5 · 兩位旅客共用同一票碼</div>
    <h2>請把下方二維碼對準驗票機</h2>
    <svg class="barcode" viewBox="1350 80 550 550" role="img" aria-label="Italo 車票二維碼">
      <image href="italo-2026-10-05-DFQYW.png" width="2480" height="3509" />
    </svg>
    <div class="code">DFQYW</div>
    <p>畫面亮度調高；若掃描不順，可報票碼或開啟下方原始 PDF。</p>
  </section>

  <section class="card">
    <div class="route">
      <div><div class="place">Venezia S. L.</div><div class="time">15:05</div></div>
      <div class="arrow">→</div>
      <div><div class="place">Bologna</div><div class="time">16:39</div></div>
    </div>
    <div class="meta">
      <div><b>車次</b>Italo 8919</div>
      <div><b>艙等</b>Prima Business</div>
      <div><b>陳文乾</b>第 1 車 · 41 號</div>
      <div><b>林惠美</b>第 1 車 · 42 號</div>
    </div>
    <div class="btns">
      <a class="btn" href="#full">查看完整票面</a>
      <a class="btn alt" href="italo-2026-10-05-DFQYW.pdf">開啟原始 PDF</a>
    </div>
  </section>

  <section class="card">
    <h2 id="full">完整票面</h2>
    <img class="full" src="italo-2026-10-05-DFQYW.png" alt="Italo 10 月 5 日完整車票">
    <div class="note">票面資料：兩人共 €36.80；票碼 DFQYW。</div>
  </section>
</main>
</body>
</html>
