<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFCF6">
<title>爸媽歐洲行 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--paper:#FFFCF6;--ink:#3E3A39;--coral:#F2A497;--yellow:#F6D27A;--blue:#A8D3E6;--green:#B9DAA5;--border:3px solid var(--ink);--r:20px;--nav-h:56px;--map-h:250px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 12px)}
body{font-family:'Huninn','Noto Sans TC',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:var(--paper);border-bottom:var(--border);height:var(--nav-h);display:flex;align-items:center;padding:0 8px 0 16px;gap:8px}
.navlinks{flex:1;min-width:0;display:flex;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{display:inline-block;padding:6px 14px;margin-right:6px;border:2px solid var(--ink);border-radius:999px;text-decoration:none;color:var(--ink);font-size:14px;flex-shrink:0;transition:background .2s,color .2s}
.navlinks a:hover,.navlinks a:focus{background:var(--ink);color:var(--paper)}
.navlinks a.act{background:var(--coral);color:var(--ink)}
.editbtn{flex-shrink:0;padding:6px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--yellow);font-size:14px}
body.editing .editbtn{background:var(--coral)}

/* HERO */
.hero{text-align:center;padding:40px 16px 16px}
.hero h1{font-size:28px;margin:12px 0 4px;letter-spacing:2px}
.hero .sub{font-size:15px;opacity:.7;margin-bottom:16px}
.cd-box{display:inline-flex;gap:12px;background:var(--yellow);border:var(--border);border-radius:var(--r);padding:12px 24px;font-size:14px}
.cd-box .n{font-size:32px;display:block}.cd-box .l{font-size:12px;opacity:.7}
.trip-fin{display:inline-block;background:var(--green);border:var(--border);border-radius:var(--r);padding:12px 24px;font-size:18px}

/* SECTIONS */
section{padding:24px 16px;max-width:640px;margin:0 auto}
.st{font-size:20px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.ic{width:36px;height:36px;border-radius:50%;border:var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec-off{opacity:.45}
.empty{font-size:13px;opacity:.6;padding:8px 0}

/* chips / small buttons */
.stages{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.sc{padding:4px 12px;border:var(--border);border-radius:999px;font-size:13px;background:var(--paper);transition:background .2s,transform .15s}
.sc:hover{transform:scale(1.05)}.sc.act{background:var(--coral)}
.dl{font-size:12px;padding:3px 10px;border:2px solid var(--ink);border-radius:999px;text-decoration:none;color:var(--ink);background:var(--paper);transition:background .2s;display:inline-block}
.dl:hover{background:var(--yellow)}
.dl.pri{background:var(--blue)}
.dr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* FLIGHT CARDS */
.fc{border:var(--border);border-radius:var(--r);padding:16px;margin-bottom:16px;position:relative;overflow:hidden}
.fc::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:var(--yellow)}
.fc.out::before{background:var(--coral)}.fc.in::before{background:var(--blue)}
.fc .rt{font-size:18px;font-weight:bold;margin-bottom:4px}
.fc .dt{font-size:13px;opacity:.8}
.cf{font-size:12px;border:2px solid var(--ink);border-radius:8px;padding:2px 8px;display:inline-block;margin-top:6px}

/* ITINERARY + MAP */
.mapcol{position:sticky;top:var(--nav-h);z-index:50;background:var(--paper);padding:8px 0;margin-bottom:8px}
.mapbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.mapbar button{font-size:12px;padding:4px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper)}
.mapbar button.act{background:var(--coral)}
.mapbar .play{background:var(--yellow)}
#map{height:var(--map-h);border:var(--border);border-radius:var(--r);overflow:hidden;background:#EAF3F6}
.mapcol.min #map,.mapcol.min .maphint{display:none}
.maphint{font-size:12px;opacity:.65;margin-top:4px;min-height:18px}
.mapfail{height:100%;display:flex;align-items:center;justify-content:center;font-size:13px;opacity:.6;padding:16px;text-align:center}
#map.picking{cursor:crosshair;outline:4px dashed var(--coral)}
.pin{width:28px;height:28px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);border:3px solid var(--ink);background:var(--coral);display:flex;align-items:center;justify-content:center}
.pin b{transform:rotate(45deg);font-size:12px;font-family:'Huninn',sans-serif}
.pin.hot{background:var(--yellow)}
.dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);background:var(--yellow)}
.hpin{font-size:20px;line-height:26px;text-align:center}
.mover{font-size:26px;line-height:32px;text-align:center}
.leaflet-container{font-family:'Huninn','Noto Sans TC',sans-serif}
.leaflet-popup-content-wrapper{border:2px solid var(--ink);border-radius:14px;box-shadow:none;background:var(--paper);color:var(--ink)}
.leaflet-popup-content{margin:8px 12px;font-size:13px}
.leaflet-popup-tip{border:2px solid var(--ink);box-shadow:none;background:var(--paper)}

.dtabs{display:flex;overflow-x:auto;gap:6px;padding:4px 2px 8px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.dtabs::-webkit-scrollbar{display:none}
.dtab{flex-shrink:0;padding:8px 14px;border:var(--border);border-radius:14px;font-size:13px;text-align:center;min-width:70px;background:var(--paper);transition:background .2s,transform .2s}
.dtab:hover{transform:translateY(-2px)}
.dtab.grp{background:var(--green)}
.dtab.key{border-color:#D9705F}
.dtab.act{background:var(--coral);transform:scale(1.05)}
.dtab .dw{font-size:11px;opacity:.6;display:block}
.dtab.add{border-style:dashed;min-width:48px}

.dp{animation:fsi .35s ease}
@keyframes fsi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.dh{font-size:18px;margin-bottom:4px}
.dc{font-size:13px;opacity:.6;margin-bottom:12px}
.tl{position:relative;padding-left:24px;margin-top:16px}
.tl::before{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:3px;background:var(--ink);border-radius:2px}
.ti{position:relative;margin-bottom:16px;padding:10px 12px 10px 14px;border-radius:14px;border:2px solid transparent;scroll-margin-top:calc(var(--nav-h) + var(--map-h) + 80px);transition:background .3s,border-color .3s}
.ti::before{content:'';position:absolute;left:-22px;top:16px;width:12px;height:12px;border-radius:50%;border:3px solid var(--ink);background:var(--dotc,var(--paper))}
.ti.has-loc{cursor:pointer}
.ti.has-loc:hover{border-color:rgba(62,58,57,.25)}
.ti.focus{background:rgba(246,210,122,.35);border-color:var(--ink)}
.tt{font-size:13px;font-weight:bold;opacity:.6}
.tn{font-size:15px;font-weight:bold;margin:2px 0}
.ts{font-size:13px;opacity:.7}
.tp{font-size:12px;margin-top:6px;padding:8px 12px;background:rgba(168,211,230,.2);border-radius:12px;line-height:1.6;white-space:pre-line}
.tw{font-size:13px;margin-top:6px;padding:6px 12px;background:rgba(242,164,151,.25);border-radius:12px;font-weight:bold}
.ct{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:2px solid var(--ink);margin-right:4px;vertical-align:middle;background:var(--dotc,var(--paper));font-weight:normal}
.mb{display:inline-block;font-size:11px;padding:1px 8px;background:var(--coral);border:2px solid var(--ink);border-radius:999px;margin-left:4px;font-weight:normal}
.mb.go{background:var(--yellow)}

/* HOTEL */
.hc{border:var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px;background:rgba(185,218,165,.15)}
.hc h4{font-size:16px;margin-bottom:4px}
.hc .me{font-size:13px;opacity:.75}.hc .me a{color:var(--ink)}

/* CHECKLIST */
.cl-t{font-size:17px;margin:20px 0 10px}
.cl-t:first-child{margin-top:0}
.cg{margin-bottom:16px}
.cg h4{font-size:15px;margin-bottom:6px;padding:6px 12px;border-radius:12px}
.cg1 h4{background:rgba(168,211,230,.3)}.cg2 h4{background:rgba(242,164,151,.3)}.cg3 h4{background:rgba(246,210,122,.3)}.cg4 h4{background:rgba(185,218,165,.3)}
.ci{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(62,58,57,.15);font-size:14px;cursor:pointer;user-select:none}
.ci:last-child{border-bottom:none}
.cb{width:24px;height:24px;border:var(--border);border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .2s;margin-top:2px}
.ci.chk .cb{background:var(--green)}.ci.chk .cb::after{content:'✓';font-size:14px}
.ci.chk .cx{text-decoration:line-through;opacity:.5}

/* CONTACT / REMINDER / LOUNGE */
.cc{border:var(--border);border-radius:14px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cc .cn{font-size:14px;font-weight:bold}.cc .co{font-size:12px;opacity:.6}
.cc .cp{font-size:13px;padding:4px 12px;background:var(--blue);border:2px solid var(--ink);border-radius:999px;text-decoration:none;color:var(--ink);flex-shrink:0}
.ri{padding:12px 16px;border:var(--border);border-radius:14px;margin-bottom:8px;font-size:13px;line-height:1.7}
.pp{border:var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.pp h4{font-size:15px;margin-bottom:8px}
.pi{font-size:13px;padding:4px 0}
.pt{display:inline-block;font-size:11px;padding:1px 8px;border:2px solid var(--ink);border-radius:999px;background:var(--blue);margin-right:4px}
.pn{font-size:12px;opacity:.8;margin-top:8px;padding:8px;background:rgba(246,210,122,.2);border-radius:10px}

/* EDIT MODE */
.et{display:none}
body.editing .et{display:flex}
.etools{gap:4px;margin-top:8px;flex-wrap:wrap}
.eb{font-size:12px;padding:3px 10px;border:2px dashed var(--ink);border-radius:999px;background:var(--paper)}
.eb:hover{background:var(--yellow)}
.eb.del:hover{background:var(--coral)}
.eb.big{padding:8px 16px;font-size:13px;width:100%;border-radius:14px;margin-top:4px}
body.editing .ti{border-color:rgba(62,58,57,.2);border-style:dashed}
.ebar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:150;background:var(--paper);border-top:var(--border);padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:6px;overflow-x:auto;white-space:nowrap}
body.editing .ebar{display:flex}
body.editing{padding-bottom:70px}
.ebar button{flex-shrink:0;font-size:13px;padding:6px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--paper)}
.ebar .main{background:var(--green)}
.banner{display:none;max-width:640px;margin:12px auto 0;padding:10px 14px;border:var(--border);border-radius:14px;background:var(--yellow);font-size:13px}
.banner.show{display:block}
.banner button{font-size:12px;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);margin:4px 4px 0 0}

/* SHEET */
.sheet-bg{display:none;position:fixed;inset:0;z-index:2000;background:rgba(62,58,57,.45);align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--paper);border:var(--border);border-bottom:none;border-radius:var(--r) var(--r) 0 0;width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column}
.sheet h3{font-size:17px;padding:14px 16px 8px}
.sheet-body{overflow-y:auto;padding:0 16px 8px;flex:1}
.sheet-foot{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:2px solid var(--ink)}
.sheet-foot button{flex:1;padding:8px;border:var(--border);border-radius:14px;background:var(--paper)}
.sheet-foot .ok{background:var(--green)}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:12px;opacity:.7;margin-bottom:2px}
.fld input[type=text],.fld input[type=date],.fld select,.fld textarea{width:100%;padding:8px 10px;border:2px solid var(--ink);border-radius:10px;background:#fff;font-size:15px}
.fld textarea{min-height:70px;resize:vertical;line-height:1.5}
.fld textarea.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:300px;white-space:pre}
.fld.chk label{display:flex;align-items:center;gap:8px;font-size:14px;opacity:1}
.fld.chk input{width:20px;height:20px}
.fgrp{font-size:14px;margin:14px 0 6px;padding:4px 10px;background:rgba(168,211,230,.3);border-radius:10px}
.locbox{border:2px solid var(--ink);border-radius:10px;padding:8px;background:#fff}
.locval{font-size:13px;margin-bottom:6px}
.locrow{display:flex;gap:6px;flex-wrap:wrap}
.locrow input{flex:1;min-width:120px}
.locres button{display:block;width:100%;text-align:left;font-size:12px;padding:6px 8px;margin-top:4px;border:1px solid var(--ink);border-radius:8px;background:var(--paper)}
.err{color:#B5442F;font-size:13px;margin-top:6px}
.lay-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed rgba(62,58,57,.2);font-size:14px}
.lay-row span{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:3000;background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* ILLUSTRATIONS */
.af{animation:gf 4s ease-in-out infinite}
@keyframes gf{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ab{animation:gb 3s ease-in-out infinite}
@keyframes gb{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(1deg)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}

.bt{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border:var(--border);border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:18px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
.bt.show{opacity:1;pointer-events:auto}
body.editing .bt{bottom:80px}
.ft{text-align:center;padding:32px 16px;font-size:12px;opacity:.4}

@media(min-width:640px){.hero h1{font-size:36px}section{padding:32px 24px}}
@media(min-width:980px){
  #sec-itinerary{max-width:1240px}
  .itin{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:28px;align-items:start}
  .mapcol{order:2;top:calc(var(--nav-h) + 12px);padding:0;margin:0;height:calc(100vh - var(--nav-h) - 24px);display:flex;flex-direction:column}
  #mapslot{flex:1;min-height:0}
  #map{height:100%}
  .mapcol.min #map,.mapcol.min .maphint{display:block}
  .minbtn{display:none}
  .ti{scroll-margin-top:calc(var(--nav-h) + 24px)}
}
</style>
</head>
<body>
<nav class="nav"><div class="navlinks" id="navlinks"></div><button class="editbtn" id="editbtn" type="button">✏️ 編輯</button></nav>
<div class="banner" id="banner"></div>
<header class="hero" id="hero">
<svg class="af" width="200" height="120" viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<ellipse cx="100" cy="108" rx="60" ry="8" fill="var(--blue)" opacity=".3"/>
<rect x="50" y="45" width="100" height="30" rx="15" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>
<path d="M150 60 L170 58 L170 62Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
<path d="M55 45 L35 25 L55 30Z" fill="var(--coral)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
<path d="M85 45 L105 20 L115 20 L105 45Z" fill="var(--yellow)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
<path d="M85 75 L105 95 L115 95 L105 75Z" fill="var(--yellow)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
<circle cx="80" cy="57" r="4" fill="var(--blue)" stroke="var(--ink)" stroke-width="2"/>
<circle cx="95" cy="57" r="4" fill="var(--blue)" stroke="var(--ink)" stroke-width="2"/>
<circle cx="110" cy="57" r="4" fill="var(--blue)" stroke="var(--ink)" stroke-width="2"/>
<circle cx="125" cy="57" r="4" fill="var(--blue)" stroke="var(--ink)" stroke-width="2"/>
<ellipse cx="30" cy="35" rx="18" ry="10" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/>
<ellipse cx="175" cy="30" rx="14" ry="8" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/>
</svg>
<h1 id="h-title"></h1>
<p class="sub" id="h-sub"></p>
<div id="cd"></div>
</header>
<main id="main"></main>
<div class="ft" id="ft"></div>
<button class="bt" id="bk" type="button" aria-label="回到最上面">↑</button>

<div class="ebar" id="ebar">
<button type="button" class="main" data-act="export">⬇ 匯出 itinerary.json</button>
<button type="button" data-act="import">⬆ 匯入</button>
<button type="button" data-act="trip">行程標題</button>
<button type="button" data-act="layout">區塊版面</button>
<button type="button" data-act="raw">原始資料</button>
<button type="button" data-act="reset">還原成線上版</button>
<button type="button" data-act="done">完成</button>
</div>
<input type="file" id="imp" accept="application/json,.json" hidden>

<script>
(function(){

function E(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function $(id){return document.getElementById(id)}
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var BASEH=hash(JSON.stringify(BASE));

var D=clone(BASE),dirty=false,stale=null;
(function(){var raw=store.get(KEY+'_draft');if(!raw)return;try{var d=JSON.parse(raw);if(d.base===BASEH){D=d.data;dirty=true}else stale=d}catch(e){}})();

 flights:{t:'航班總覽',ic:'✈',c:'blue',r:rFlights,has:function(){return flights().length}},

};

/* ---------- route model ---------- */
function same(a,b){return Math.abs(a[0]-b[0])<2e-4&&Math.abs(a[1]-b[1])<2e-4}

 (d.stops||[]).forEach(function(s,si){if(okLoc(s.loc))push(ll(s.loc),s.loc.name||s.name,si,null);if(okLoc(s.to))push(ll(s.to),s.to.name||s.name,si,okLoc(s.loc)?modeOf(s.cat):null)});
 return pts}
function arc(a,b){var dla=b[0]-a[0],dln=b[1]-a[1],d=Math.sqrt(dla*dla+dln*dln);if(d<1e-6)return [a,b];var sg=dln>=0?1:-1,h=d*0.18,c=[(a[0]+b[0])/2+sg*dln/d*h,(a[1]+b[1])/2-sg*dla/d*h],o=[];
 for(var i=0;i<=32;i++){var t=i/32,u=1-t;o.push([u*u*a[0]+2*u*t*c[0]+t*t*b[0],u*u*a[1]+2*u*t*c[1]+t*t*b[1]])}return o}
function segsOf(pts){var o=[];for(var i=1;i<pts.length;i++){var m=pts[i].inMode||'link',a=pts[i-1].ll,b=pts[i].ll;o.push({mode:m,di:pts[i].di,from:pts[i-1],to:pts[i],path:m==='flight'?arc(a,b):[a,b]})}return o}

function play(){if(!map)return;if(S.playing){stopPlay();return}var segs=segsOf(tripPts());if(!segs.length){toast('還沒有可以播放的路線');return}

 var i=0,mk=null;
 function next(){if(!S.playing)return;if(i>=segs.length){stopPlay();toast('播放完畢');return}
  var s=segs[i++];if(s.di!==S.day||i===1){setDay(s.di,{keepView:true})}
  var hint=$('maphint'),dd=days()[s.di];if(hint)hint.textContent=(dd.label||dd.date.slice(5).replace('-','/'))+'　'+s.from.name+' → '+s.to.name;

/* ---------- sheet / forms ---------- */
var sheetSave=null,sheetVals=null;
function openSheet(title,body,onSave,okLabel){$('sh-t').textContent=title;$('sh-b').innerHTML=body;$('sh-ok').textContent=okLabel||'儲存';$('sh-b').onclick=null;$('sh-b').onchange=null;sheetSave=onSave;$('sheetbg').classList.add('show');$('sh-b').scrollTop=0}
function closeSheet(){$('sheetbg').classList.remove('show');sheetSave=null}
function getPath(o,p){return p.split('.').reduce(function(a,k){return a==null?undefined:a[k]},o)}
function setPath(o,p,v){var ks=p.split('.'),a=o;for(var i=0;i<ks.length-1;i++){if(a[ks[i]]==null||typeof a[ks[i]]!=='object')a[ks[i]]={};a=a[ks[i]]}var k=ks[ks.length-1];if(v===''||v==null||v===false)delete a[k];else a[k]=v}
function fieldHTML(f,vals){if(f.type==='group')return '<div class="fgrp">'+E(f.l)+'</div>';
 var v=getPath(vals,f.k),id='f_'+f.k.replace(/\./g,'_');
 if(f.type==='check')return '<div class="fld chk"><label><input type="checkbox" id="'+id+'"'+(v?' checked':'')+'>'+E(f.l)+'</label></div>';
 if(f.type==='area')return '<div class="fld"><label for="'+id+'">'+E(f.l)+'</label><textarea id="'+id+'">'+E(v||'')+'</textarea></div>';
 if(f.type==='select')return '<div class="fld"><label for="'+id+'">'+E(f.l)+'</label><select id="'+id+'">'+f.opts.map(function(o){return '<option value="'+E(o[0])+'"'+(String(o[0])===String(v)?' selected':'')+'>'+E(o[1])+'</option>'}).join('')+'</select></div>';
 if(f.type==='loc')return '<div class="fld"><label>'+E(f.l)+'</label><div class="locbox" data-lock="'+f.k+'"><div class="locval"></div><div class="locrow"><input type="text" class="locq" placeholder="輸入地名搜尋，或貼上「緯度, 經度」"><button type="button" class="eb" data-act="locsearch">搜尋</button><button type="button" class="eb" data-act="locpick">在地圖上點</button><button type="button" class="eb del" data-act="locclear">清除</button></div><div class="locres"></div></div></div>';
 return '<div class="fld"><label for="'+id+'">'+E(f.l)+'</label><input type="'+(f.type==='date'?'date':'text')+'" id="'+id+'" value="'+E(v||'')+'"'+(f.list?' list="'+f.list+'"':'')+'></div>'}
function locShow(box){var k=box.getAttribute('data-lock'),v=getPath(sheetVals,k);box.querySelector('.locval').innerHTML=okLoc(v)?'📍 <b>'+E(v.name||'已設定')+'</b>（'+(+v.lat).toFixed(4)+', '+(+v.lng).toFixed(4)+'）':'尚未設定地點（不設定就不會出現在地圖上）'}
function openForm(title,fields,vals,onSave){sheetVals=vals;
 openSheet(title,fields.map(function(f){return fieldHTML(f,vals)}).join('')+'<datalist id="catlist">'+CATS.map(function(c){return '<option value="'+E(c)+'">'}).join('')+'</datalist><div class="err" id="sh-err"></div>',function(){
  fields.forEach(function(f){if(f.type==='group'||f.type==='loc')return;var el=$('f_'+f.k.replace(/\./g,'_'));if(!el)return;setPath(vals,f.k,f.type==='check'?el.checked:el.value.trim())});
  var er=onSave(vals);if(er){$('sh-err').textContent=er;return false}});
 var bs=document.querySelectorAll('#sh-b .locbox');for(var i=0;i<bs.length;i++)locShow(bs[i])}
function locAction(act,box){var k=box.getAttribute('data-lock'),q=box.querySelector('.locq'),res=box.querySelector('.locres');
 function set(v){if(v)setPath(sheetVals,k,v);else setPath(sheetVals,k,null);res.innerHTML='';locShow(box)}
 if(act==='locclear'){set(null);return}
 if(act==='locpick'){if(!map){toast('地圖沒有載入，無法點選');return}$('sheetbg').classList.remove('show');S.pick=function(p){var cur=getPath(sheetVals,k)||{};p.name=q.value.trim()||cur.name||'';set(p);$('sheetbg').classList.add('show')};mapEl.classList.add('picking');var mc=$('mapcol');mc.classList.remove('min');map.invalidateSize();mc.scrollIntoView({block:'start'});toast('在地圖上點一下要的位置');return}
 var text=q.value.trim();if(!text)return;var m=text.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,，\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
 if(m){var cur=getPath(sheetVals,k)||{};set({lat:+m[1],lng:+m[2],name:cur.name||''});return}
 res.innerHTML='<div class="empty">搜尋中…</div>';
 fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=zh-TW,en&q='+encodeURIComponent(text)).then(function(r){return r.json()}).then(function(a){
  if(!a.length){res.innerHTML='<div class="empty">找不到。換個寫法（英文或當地文字），或改用「在地圖上點」。</div>';return}
  res.innerHTML=a.map(function(x,i){return '<button type="button" data-i="'+i+'">'+E(x.display_name)+'</button>'}).join('');
  res.onclick=function(e){var b=e.target.closest('button');if(!b)return;var x=a[+b.getAttribute('data-i')];set({lat:+(+x.lat).toFixed(5),lng:+(+x.lon).toFixed(5),name:text})}
 }).catch(function(){res.innerHTML='<div class="empty">搜尋失敗（需要網路）。可改用「在地圖上點」。</div>'})}

var DOW='日一二三四五六';
function stopFields(){return [
 {k:'name',l:'標題'},{k:'time',l:'時間（例：14:05、上午、全天）'},{k:'cat',l:'分類（可自己打字）',list:'catlist'},
 {k:'sub',l:'一行說明'},{k:'warn',l:'警語（紅框；★ 開頭會標「必看」）',type:'area'},{k:'tip',l:'詳細說明',type:'area'},{k:'conf',l:'訂位／確認碼'},
 {k:'must',l:'標成「必去」',type:'check'},
 {type:'group',l:'地圖'},{k:'loc',l:'地點（出發點）',type:'loc'},{k:'to',l:'移動目的地（航班、火車、交通才需要）',type:'loc'},{k:'mapq',l:'Google 地圖搜尋字串（選填）'},
 {type:'group',l:'其他'},{k:'tel',l:'電話'},{k:'link',l:'連結網址'},{k:'linklabel',l:'連結按鈕文字'},{k:'hideInFlights',l:'不列入「航班總覽」（分類為航班時）',type:'check'},
 {k:'_day',l:'放在哪一天',type:'select',opts:days().map(function(d,i){return [i,(d.label||d.date.slice(5).replace('-','/'))+' '+d.title]})}]}
function editStop(si){var d=days()[S.day],isNew=si==null,v=isNew?{cat:'行程'}:clone(d.stops[si]);v._day=S.day;
 openForm(isNew?'新增卡片':'編輯卡片',stopFields(),v,function(v){if(!v.name)return '請填標題';var to=+v._day;delete v._day;
  if(isNew)days()[to].stops.push(v);else if(to===S.day)d.stops[si]=v;else{d.stops.splice(si,1);days()[to].stops.push(v);S.day=to}
  closeSheet();commit();toast('已儲存在這台裝置')})}
function dayFields(){return [{k:'date',l:'日期',type:'date'},{k:'title',l:'標題'},{k:'city',l:'城市'},{k:'label',l:'日期籤文字（選填，跨日區塊用，例：10/7–10/19）'},{k:'dow',l:'星期（留空自動算）'},
 {k:'key',l:'重要的日子（加深外框）',type:'check'},{k:'group',l:'跟團區塊（綠色日期籤）',type:'check'},
 {type:'group',l:'住宿（沒有就把名稱留空）'},{k:'hotel.name',l:'飯店名稱'},{k:'hotel.addr',l:'地址'},{k:'hotel.conf',l:'確認碼'},{k:'hotel.pay',l:'付款狀態'},{k:'hotel.tel',l:'電話'},{k:'hotel.note',l:'備註',type:'area'},{k:'hotel.loc',l:'飯店位置',type:'loc'},{k:'hotel.mapq',l:'Google 地圖搜尋字串（選填）'}]}
function editDay(isNew){var ds=days(),v;if(isNew){var last=ds[ds.length-1],nd='';if(last){var t=new Date(last.date+'T12:00:00');t.setDate(t.getDate()+1);nd=t.toISOString().slice(0,10)}v={date:nd,title:'',stops:[]}}else v=clone(ds[S.day]);
 openForm(isNew?'新增一天':'編輯這一天',dayFields(),v,function(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v.date||''))return '請選日期';if(!v.title)return '請填標題';
  if(!v.dow){var t=new Date(v.date+'T12:00:00');v.dow=DOW.charAt(t.getDay())}
  if(v.hotel&&!v.hotel.name)delete v.hotel;if(!v.stops)v.stops=[];
  if(isNew)ds.push(v);else ds[S.day]=v;
  ds.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});S.day=ds.indexOf(v);closeSheet();commit();toast('已儲存在這台裝置')})}
function editTrip(){var v={META:clone(D.META||{})};if(!v.META.title)v.META.title=(D.TRIP||{}).title||'';if(!v.META.subtitle)v.META.subtitle=(D.TRIP||{}).note||'';
 openForm('行程標題',[{k:'META.title',l:'標題'},{k:'META.subtitle',l:'副標（路線簡述）',type:'area'},{k:'META.start',l:'出發時間（倒數用，例：2026-09-23T21:45:00+08:00；留空用第一天）'},{k:'META.end',l:'回程時間（留空用最後一天）'}],v,function(v){D.META=v.META;closeSheet();commit()})}
function editLayout(){var L=clone(layout());function body(){return L.map(function(x,i){return '<div class="lay-row"><input type="checkbox" data-i="'+i+'"'+(x.hide?'':' checked')+' aria-label="顯示"><span>'+E(SECS[x.id].t)+'</span><button type="button" class="eb" data-lay="up" data-i="'+i+'">↑</button><button type="button" class="eb" data-lay="down" data-i="'+i+'">↓</button></div>'}).join('')+'<div class="empty">打勾＝顯示。沒有內容的區塊在瀏覽模式會自動隱藏。</div>'}
 openSheet('區塊版面',body(),function(){D.LAYOUT=L.map(function(x){var o={id:x.id};if(x.hide)o.hide=true;if(x.title)o.title=x.title;return o});closeSheet();commit()});
 $('sh-b').onclick=function(e){var b=e.target.closest('[data-lay]');if(b){var i=+b.getAttribute('data-i'),j=b.getAttribute('data-lay')==='up'?i-1:i+1;if(j<0||j>=L.length)return;var t=L[i];L[i]=L[j];L[j]=t;$('sh-b').innerHTML=body();return}var c=e.target.closest('input[type=checkbox]');if(c)L[+c.getAttribute('data-i')].hide=!c.checked}}
function editRaw(key){var keys=Object.keys(D);['CHECKLISTS','REMINDERS','CONTACTS','PRIORITYPASS','STAGES','META'].forEach(function(k){if(keys.indexOf(k)<0)keys.push(k)});key=key||keys[0];
 var HELP={CHECKLISTS:'格式：[{"title":"行李清單","groups":[{"g":"證件","i":["護照","機票"]}]}]',REMINDERS:'格式：["第一條提醒","第二條提醒"]',CONTACTS:'格式：[{"label":"名稱","tel":"+886…","note":"備註"}]',PRIORITYPASS:'格式：[{"air":"機場","day":"日期","items":[{"t":"貴賓室","n":"名稱","w":"位置"}],"note":"","link":""}]',STAGES:'格式：[{"n":"階段名稱","a":"d2026-09-23"}]'};
 function body(k){var val=D[k]===undefined?(k==='META'?{}:[]):D[k];return '<div class="fld"><label for="rawkey">要編輯的資料區塊</label><select id="rawkey">'+keys.map(function(x){return '<option'+(x===k?' selected':'')+'>'+E(x)+'</option>'}).join('')+'</select></div><div class="empty">'+E(HELP[k]||'')+'</div><div class="fld"><textarea class="code" id="rawtxt" spellcheck="false">'+E(JSON.stringify(val,null,2))+'</textarea></div><div class="err" id="sh-err"></div>'}
 openSheet('原始資料（JSON）',body(key),function(){var k=$('rawkey').value,v;try{v=JSON.parse($('rawtxt').value)}catch(e){$('sh-err').textContent='格式有誤：'+e.message;return false}
  if(k==='TRIP'&&(!v||!Array.isArray(v.days))){$('sh-err').textContent='TRIP 一定要有 days 陣列';return false}D[k]=v;closeSheet();commit();toast('已套用')},'套用');
 $('sh-b').onchange=function(e){if(e.target.id==='rawkey')$('sh-b').innerHTML=body(e.target.value)}}
function exportJSON(){var blob=new Blob([JSON.stringify(D,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='itinerary.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);toast('已下載 itinerary.json')}
function resetDraft(){store.del(KEY+'_draft');D=clone(BASE);dirty=false;stale=null;renderAll()}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var ci=e.target.closest('.ci');if(ci){ci.classList.toggle('chk');store.set(ci.getAttribute('data-k'),ci.classList.contains('chk')?'1':'0');return}
 var b=e.target.closest('[data-act]');
 if(!b){var card=e.target.closest('.ti.has-loc');if(card&&!e.target.closest('a,button'))mapFocus(+card.getAttribute('data-si'));return}
 var act=b.getAttribute('data-act'),si=b.hasAttribute('data-si')?+b.getAttribute('data-si'):null,d=days()[S.day];
 if(/^loc/.test(act)){locAction(act,b.closest('.locbox'));return}
 switch(act){
  case 'day':stopPlay();setDay(+b.getAttribute('data-di'));break;
  case 'goto':stopPlay();S.mode='day';setDay(+b.getAttribute('data-di'));$('sec-itinerary').scrollIntoView();setTimeout(function(){cardFocus(si,true)},300);break;
  case 'mode':stopPlay();S.mode=b.getAttribute('data-m');setDay(S.day);break;
  case 'play':play();break;
  case 'min':$('mapcol').classList.toggle('min');if(map)map.invalidateSize();break;
  case 'focus':mapFocus(si);break;
  case 'editstop':editStop(si);break;
  case 'addstop':editStop(null);break;
  case 'dup':d.stops.splice(si+1,0,clone(d.stops[si]));commit();break;
  case 'up':case 'down':var j=act==='up'?si-1:si+1;if(j<0||j>=d.stops.length)break;var t=d.stops[si];d.stops[si]=d.stops[j];d.stops[j]=t;commit();break;
  case 'delstop':if(confirm('刪除「'+d.stops[si].name+'」？'))(d.stops.splice(si,1),commit());break;
  case 'editday':editDay(false);break;
  case 'addday':editDay(true);break;
  case 'delday':if(confirm('刪除「'+d.title+'」這一天和裡面的 '+(d.stops||[]).length+' 張卡片？'))(days().splice(S.day,1),commit());break;
  case 'rawkey':editRaw(b.getAttribute('data-key'));break;
  case 'raw':editRaw();break;
  case 'layout':editLayout();break;
  case 'trip':editTrip();break;
  case 'export':exportJSON();break;
  case 'import':$('imp').click();break;
  case 'reset':if(confirm('丟掉這台裝置上所有還沒匯出的修改，回到線上版？'))resetDraft();break;
  case 'usestale':D=stale.data;stale=null;commit();break;
  case 'dropstale':store.del(KEY+'_draft');stale=null;banner();break;
  case 'done':toggleEdit(false);break;
 }});
document.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&e.target.classList&&e.target.classList.contains('ci')){e.preventDefault();e.target.click()}if(e.key==='Escape'&&$('sheetbg').classList.contains('show'))closeSheet()});
$('imp').addEventListener('change',function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var v=JSON.parse(r.result);if(!v.TRIP||!Array.isArray(v.TRIP.days))throw new Error('找不到 TRIP.days');D=v;S.day=0;commit();toast('已匯入')}catch(err){alert('這個檔案不能用：'+err.message)}};r.readAsText(f);this.value=''});
$('sh-x').onclick=closeSheet;
$('sh-ok').onclick=function(){if(sheetSave)sheetSave()};
$('sheetbg').addEventListener('click',function(e){if(e.target===this)closeSheet()});
function toggleEdit(on){stopPlay();document.body.classList.toggle('editing',on);$('editbtn').textContent=on?'✓ 完成':'✏️ 編輯';renderAll();if(on)toast('編輯模式：修改只存在這台裝置，匯出後才能上線')}
$('editbtn').onclick=function(){toggleEdit(!editing())};
$('bk').onclick=function(){window.scrollTo({top:0})};
var spy=[];
function navSpy(){spy=[];var as=document.querySelectorAll('#navlinks a');for(var i=0;i<as.length;i++){var t=$(as[i].getAttribute('href').slice(1));if(t)spy.push({el:t,a:as[i]})}onScroll()}
function onScroll(){$('bk').classList.toggle('show',window.scrollY>400);var top=window.scrollY+90,cur=null;spy.forEach(function(s){if(s.el.offsetTop<=top)cur=s});spy.forEach(function(s){s.a.classList.toggle('act',s===cur)})}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',function(){if(map)map.invalidateSize()});

/* ---------- start ---------- */
(function(){var today=new Date().toISOString().slice(0,10),ds=days();if(ds.length&&today>=ds[0].date&&today<=ds[ds.length-1].date)S.day=dayIndexByDate(today)})();
renderAll();countdown();setInterval(countdown,6e4);
window.__trip={get data(){return D},state:S,setDay:setDay,play:play};
})();
</script>
