<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFCF6">
<title>爸媽歐洲行 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFCF6;--ink:#3E3A39;--coral:#F2A497;--yellow:#F6D27A;--blue:#A8D3E6;--green:#B9DAA5;--border:3px solid var(--ink);--r:20px;--nav-h:56px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h)+12px)}
body{font-family:'Huninn','Noto Sans TC',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:var(--paper);border-bottom:var(--border);height:var(--nav-h);display:flex;align-items:center;padding:0 16px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{display:none}
.nav a{display:inline-block;padding:6px 14px;margin-right:6px;border:2px solid var(--ink);border-radius:999px;text-decoration:none;color:var(--ink);font-size:14px;flex-shrink:0;transition:background .2s,color .2s}
.nav a:hover,.nav a:focus{background:var(--ink);color:var(--paper)}
.nav a.act{background:var(--coral)}

/* HERO */
.hero{text-align:center;padding:48px 16px 24px;overflow:hidden}
.hero h1{font-size:28px;margin:12px 0 4px;letter-spacing:2px}
.hero .sub{font-size:15px;opacity:.7;margin-bottom:16px}
.cd-box{display:inline-flex;gap:12px;background:var(--yellow);border:var(--border);border-radius:var(--r);padding:12px 24px;font-size:14px}
.cd-box .n{font-size:32px;display:block}.cd-box .l{font-size:12px;opacity:.7}
.trip-fin{display:inline-block;background:var(--green);border:var(--border);border-radius:var(--r);padding:12px 24px;font-size:18px}

/* SECTIONS */
section{padding:24px 16px;max-width:640px;margin:0 auto}
.st{font-size:20px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.ic{width:36px;height:36px;border-radius:50%;border:var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* STAGES */
.stages{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.sc{padding:6px 14px;border:var(--border);border-radius:999px;font-size:13px;cursor:pointer;transition:background .2s,transform .15s;user-select:none}
.sc:hover{transform:scale(1.05)}.sc.act{background:var(--coral)}

/* FLIGHT CARDS */
.fc{border:var(--border);border-radius:var(--r);padding:16px;margin-bottom:16px;position:relative;overflow:hidden}
.fc::before{content:'';position:absolute;top:0;left:0;right:0;height:6px}
.fc.out::before{background:var(--coral)}.fc.in::before{background:var(--blue)}.fc.mid::before{background:var(--yellow)}
.fc .rt{font-size:18px;font-weight:bold;margin-bottom:4px}
.fc .dt{font-size:13px;opacity:.8}
.fc .cf{font-size:12px;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:2px 8px;display:inline-block;margin-top:8px}
.dr{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dl{font-size:12px;padding:3px 10px;border:2px solid var(--ink);border-radius:999px;text-decoration:none;color:var(--ink);transition:background .2s}
.dl:hover{background:var(--yellow)}

/* DATE TABS */
.dtabs{display:flex;overflow-x:auto;gap:6px;padding-bottom:8px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
.dtabs::-webkit-scrollbar{display:none}
.dtab{flex-shrink:0;padding:8px 14px;border:var(--border);border-radius:14px;font-size:13px;cursor:pointer;text-align:center;min-width:70px;transition:background .2s,transform .2s;user-select:none}
.dtab:hover{transform:translateY(-2px)}
.dtab.act{background:var(--coral);transform:scale(1.05)}
.dtab .dw{font-size:11px;opacity:.6;display:block}
.dtab.grp{background:var(--green);opacity:.85}.dtab.grp.act{opacity:1;background:var(--coral)}
.dtab.key{border-width:3px;border-color:var(--coral)}

/* TIMELINE */
.dp{display:none}.dp.act{display:block;animation:fsi .35s ease}
@keyframes fsi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.dh{font-size:18px;margin-bottom:4px}
.dc{font-size:13px;opacity:.6;margin-bottom:16px}
.tl{position:relative;padding-left:24px}
.tl::before{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:3px;background:var(--ink);border-radius:2px}
.ti{position:relative;margin-bottom:20px;padding-left:16px}
.ti::before{content:'';position:absolute;left:-20px;top:8px;width:12px;height:12px;border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
.ti.c-flight::before{background:var(--blue)}
.ti.c-important::before{background:var(--coral)}
.ti.c-transport::before,.ti.c-train::before{background:var(--yellow)}
.ti.c-hotel::before{background:var(--green)}
.ti.c-tour::before{background:var(--green)}
.ti.c-gather::before{background:var(--coral)}
.ti.c-free::before{background:var(--yellow)}
.ti.c-transit::before{background:var(--blue)}
.tt{font-size:13px;font-weight:bold;opacity:.6}
.tn{font-size:15px;font-weight:bold;margin:2px 0}
.ts{font-size:13px;opacity:.7}
.tp{font-size:12px;margin-top:6px;padding:8px 12px;background:rgba(168,211,230,.2);border-radius:12px;line-height:1.6;white-space:pre-line}
.tw{font-size:13px;margin-top:6px;padding:6px 12px;background:rgba(242,164,151,.25);border-radius:12px;font-weight:bold}
.ct{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:2px solid var(--ink);margin-right:4px;vertical-align:middle}
.ct-f{background:var(--blue)}.ct-i{background:var(--coral)}.ct-x,.ct-r{background:var(--yellow)}.ct-h,.ct-g{background:var(--green)}.ct-m{background:var(--coral)}.ct-e{background:var(--yellow)}.ct-t{background:var(--blue)}
.mb{display:inline-block;font-size:11px;padding:1px 8px;background:var(--coral);border:2px solid var(--ink);border-radius:999px;margin-left:4px}
.td{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* HOTEL */
.hc{border:var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px;background:rgba(185,218,165,.15)}
.hc h4{font-size:16px;margin-bottom:4px}
.hc .me{font-size:13px;opacity:.7}.hc .me a{color:var(--ink)}
.hd{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* CHECKLIST */
.cg{margin-bottom:20px}
.cg h3{font-size:16px;margin-bottom:8px;padding:6px 12px;border-radius:12px}
.cg.cg1 h3{background:rgba(168,211,230,.3)}.cg.cg2 h3{background:rgba(242,164,151,.3)}.cg.cg3 h3{background:rgba(246,210,122,.3)}.cg.cg4 h3{background:rgba(185,218,165,.3)}
.ci{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(62,58,57,.15);font-size:14px;cursor:pointer;user-select:none}
.ci:last-child{border-bottom:none}
.cb{width:24px;height:24px;border:var(--border);border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .2s;margin-top:2px}
.ci.chk .cb{background:var(--green)}.ci.chk .cb::after{content:'✓';font-size:14px}
.ci.chk .cx{text-decoration:line-through;opacity:.5}

/* CONTACT */
.cc{border:var(--border);border-radius:14px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.cc .cn{font-size:14px;font-weight:bold}.cc .co{font-size:12px;opacity:.6}
.cc .cp{font-size:13px;padding:4px 12px;background:var(--blue);border:2px solid var(--ink);border-radius:999px;text-decoration:none;color:var(--ink);flex-shrink:0}

/* REMINDER */
.ri{padding:12px 16px;border:var(--border);border-radius:14px;margin-bottom:8px;font-size:13px;line-height:1.7}

/* PP */
.pp{border:var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
.pp h4{font-size:15px;margin-bottom:8px}
.pi{font-size:13px;padding:4px 0}
.pt{display:inline-block;font-size:11px;padding:1px 8px;border:2px solid var(--ink);border-radius:999px;background:var(--blue);margin-right:4px}
.pn{font-size:12px;opacity:.7;margin-top:8px;padding:8px;background:rgba(246,210,122,.2);border-radius:10px}

/* ILLUSTRATIONS */
.af{animation:gf 4s ease-in-out infinite}
@keyframes gf{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.as{animation:gs 5s ease-in-out infinite;transform-origin:bottom center}
@keyframes gs{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.ab{animation:gb 3s ease-in-out infinite}
@keyframes gb{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(1deg)}}

/* REDUCED MOTION */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}html{scroll-behavior:auto}.dp.act{animation:none}}

/* BACK TOP */
.bt{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border:var(--border);border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;opacity:0;transition:opacity .3s;z-index:90}
.bt.show{opacity:1}

.ft{text-align:center;padding:32px 16px;font-size:12px;opacity:.4}
@media(min-width:640px){.hero h1{font-size:36px}section{padding:32px 24px}}
</style>
</head>

!function(){var c=document.getElementById('stg');D.STAGES.forEach(function(s){var d=document.createElement('div');d.className='sc';d.textContent=s.n;d.onclick=function(){document.querySelectorAll('.sc').forEach(function(x){x.classList.remove('act')});d.classList.add('act');var t=document.getElementById(s.a);if(t){t.scrollIntoView({behavior:'smooth',block:'start'});at(s.a.replace('d',''))}};c.appendChild(d)})}();

// Cat class map
var CM={'航班':'c-flight','重要':'c-important','交通':'c-transport','火車':'c-train','住宿':'c-hotel','跟團':'c-tour','集合':'c-gather','自由行':'c-free','轉機':'c-transit'};
var TM={'航班':'ct-f','重要':'ct-i','交通':'ct-x','火車':'ct-r','住宿':'ct-h','跟團':'ct-g','集合':'ct-m','自由行':'ct-e','轉機':'ct-t'};

// Flights
!function(){var c=document.getElementById('fcs');D.TRIP.days.forEach(function(day){day.stops.forEach(function(s){if(s.cat!=='航班'||!s.name.match(/^(TK|A3|TP)/))return;var cls='fc';if(s.name.match(/桃園|布拉格 →/))cls+=' out';else if(s.name.match(/→ 桃園/))cls+=' in';else cls+=' mid';var h='<div class="'+cls+'"><div class="rt">'+E(s.name)+'</div><div class="dt">'+E(s.sub||'')+'</div>';if(s.conf)h+='<div class="cf">訂位 '+E(s.conf)+'</div>';if(s.docs&&s.docs.length){h+='<div class="dr">';s.docs.forEach(function(d){h+='<a class="dl" href="'+E(d.file)+'" target="_blank">'+E(d.label)+'</a>'});h+='</div>'}h+='</div>';c.innerHTML+=h})})}();

// Date tabs + panels
function at(ds){document.querySelectorAll('.dtab').forEach(function(t){t.classList.toggle('act',t.dataset.d===ds);if(t.dataset.d===ds)t.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})});document.querySelectorAll('.dp').forEach(function(p){p.classList.toggle('act',p.dataset.d===ds)})}
!function(){var tc=document.getElementById('dtabs'),pc=document.getElementById('dps');D.TRIP.days.forEach(function(day){var ds=day.date,lb=day.label||ds.slice(5).replace('-','/');var d=document.createElement('div');d.className='dtab'+(day.group?' grp':'')+(day.key?' key':'');d.dataset.d=ds;d.innerHTML='<span>'+lb+'</span><span class="dw">'+E(day.dow||'')+'</span>';d.onclick=function(){at(ds)};tc.appendChild(d);
var p=document.createElement('div');p.className='dp';p.id='d'+ds;p.dataset.d=ds;
var h='<div class="dh">'+E(day.title)+'</div><div class="dc">'+E(day.city||'')+'</div>';
if(day.hotel){h+='<div class="hc"><h4>🏨 '+E(day.hotel.name)+'</h4><div class="me">';if(day.hotel.conf)h+='確認碼 '+E(day.hotel.conf)+'<br>';if(day.hotel.pay)h+=E(day.hotel.pay)+'<br>';if(day.hotel.tel)h+='<a href="tel:'+E(day.hotel.tel)+'">'+E(day.hotel.tel)+'</a><br>';if(day.hotel.note)h+=E(day.hotel.note);h+='</div>';if(day.hotel.docs&&day.hotel.docs.length){h+='<div class="hd">';day.hotel.docs.forEach(function(d){h+='<a class="dl" href="'+E(d.file)+'" target="_blank">'+E(d.label)+'</a>'});h+='</div>'}h+='</div>'}
h+='<div class="tl">';
day.stops.forEach(function(s){var cc=CM[s.cat]||'';h+='<div class="ti '+cc+'"><div class="tt">'+E(s.time||'')+'</div><div class="tn"><span class="ct '+(TM[s.cat]||'')+'">'+E(s.cat||'')+'</span>'+E(s.name);if(s.cat==='重要'||(s.warn&&s.warn.startsWith('★')))h+='<span class="mb">必看</span>';h+='</div>';if(s.sub)h+='<div class="ts">'+E(s.sub)+'</div>';if(s.conf)h+='<div style="font-size:12px;margin-top:4px"><span style="background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:2px 8px">訂位 '+E(s.conf)+'</span></div>';if(s.warn)h+='<div class="tw">'+E(s.warn)+'</div>';if(s.tip)h+='<div class="tp">'+E(s.tip)+'</div>';if(s.docs&&s.docs.length){h+='<div class="td">';s.docs.forEach(function(d){h+='<a class="dl" href="'+E(d.file)+'" target="_blank">'+E(d.label)+'</a>'});h+='</div>'}if(s.imgs&&s.imgs.length){h+='<div class="td">';s.imgs.forEach(function(d){h+='<a class="dl" href="'+E(d.file)+'" target="_blank">'+E(d.label)+'</a>'});h+='</div>'}h+='</div>'});
h+='</div>';p.innerHTML=h;pc.appendChild(p)});at(D.TRIP.days[0].date)}();

// Hotels
!function(){var c=document.getElementById('htls'),seen={};D.TRIP.days.forEach(function(day){if(!day.hotel||seen[day.hotel.name+day.hotel.conf])return;seen[day.hotel.name+day.hotel.conf]=1;var h=day.hotel;var o='<div class="hc"><h4>'+E(h.name)+'</h4><div class="me">📅 '+E(day.date.slice(5).replace('-','/'))+(day.title?' '+E(day.title):'')+'<br>';if(h.conf)o+='確認碼 '+E(h.conf)+'<br>';if(h.pay)o+='💰 '+E(h.pay)+'<br>';if(h.addr)o+='📍 '+E(h.addr)+'<br>';if(h.tel)o+='📞 <a href="tel:'+E(h.tel)+'">'+E(h.tel)+'</a><br>';if(h.note)o+=E(h.note);o+='</div>';if(h.docs&&h.docs.length){o+='<div class="hd">';h.docs.forEach(function(d){o+='<a class="dl" href="'+E(d.file)+'" target="_blank">'+E(d.label)+'</a>'});o+='</div>'}o+='</div>';c.innerHTML+=o})}();

// Priority Pass
!function(){var c=document.getElementById('pps');D.PRIORITYPASS.forEach(function(pp){var h='<div class="pp"><h4>'+E(pp.air)+' — '+E(pp.day)+'</h4>';pp.items.forEach(function(it){h+='<div class="pi"><span class="pt">'+E(it.t)+'</span><strong>'+E(it.n)+'</strong><br><span style="font-size:12px;opacity:.6">'+E(it.w)+'</span></div>'});if(pp.note)h+='<div class="pn">'+E(pp.note)+'</div>';if(pp.link)h+='<div style="margin-top:8px"><a class="dl" href="'+E(pp.link)+'" target="_blank">查看詳情</a></div>';h+='</div>';c.innerHTML+=h})}();

// Pre-departure
!function(){var gs=[{g:'出發前 24 小時',i:['線上報到所有航班，登機證存手機＋印紙本','確認航班實際起降時間與航廈','查當地天氣，決定行李內容']},{g:'出發前 3 天',i:['護照效期檢查（須超過回國日 6 個月）','信用卡開啟海外刷卡功能','通知銀行出國日期避免鎖卡','換歐元現金（建議 €400）','準備捷克克朗零錢']},{g:'出發前 1 天',i:['確認桃園機場航廈（土航在第二航廈）','所有電子票印紙本備份','手機下載離線地圖','確認飯店接駁／入住時間','行李最終檢查']},{g:'隨時留意',i:['水上巴士／渡輪遇風浪或罷工會停駛','希臘團的島際快船容易受天候影響','義大利與葡萄牙城市稅金額以現場為準']}];var c=document.getElementById('predl');gs.forEach(function(g,gi){var h='<div class="cg cg'+((gi%4)+1)+'"><h3>'+E(g.g)+'</h3>';g.i.forEach(function(it,idx){var k='pre_'+gi+'_'+idx,ck=lc(k);h+='<div class="ci'+(ck?' chk':'')+'" data-k="'+E(k)+'"><div class="cb"></div><div class="cx">'+E(it)+'</div></div>'});h+='</div>';c.innerHTML+=h})}();

// Packing
!function(){var gs=[{g:'證件與文件',c:1,i:['護照（兩本）','護照影本（與正本分開放）','電子機票列印本','飯店訂房確認列印','旅遊保險文件','信用卡（至少兩張）','現金歐元','捷克克朗','台幣零錢（回程用）']},{g:'衣物（10 月秋天）',c:2,i:['薄羽絨外套或風衣','長袖上衣 × 5','薄毛衣 × 2','長褲 × 3','內衣褲 × 7','襪子 × 7','舒適好走的鞋','拖鞋（飯店用）','帽子','圍巾']},{g:'盥洗用品',c:3,i:['牙刷牙膏','洗面乳','防曬乳','護唇膏','梳子','毛巾（薄）','面紙＋濕紙巾']},{g:'電子產品',c:1,i:['手機充電器 × 2','行動電源','萬用轉接頭（歐規圓腳）','耳機','相機（選配）']},{g:'藥品',c:4,i:['個人處方藥','胃腸藥','止痛藥','暈船藥（希臘渡輪用）','OK繃','防蚊液']},{g:'其他',c:3,i:['摺疊購物袋','透明夾鏈袋（液體隨身）','筆（入境卡用）','小鎖頭','頸枕','眼罩耳塞']}];var c=document.getElementById('pkl');gs.forEach(function(g,gi){var h='<div class="cg cg'+g.c+'"><h3>'+E(g.g)+'</h3>';g.i.forEach(function(it,idx){var k='pk_'+gi+'_'+idx,ck=lc(k);h+='<div class="ci'+(ck?' chk':'')+'" data-k="'+E(k)+'"><div class="cb"></div><div class="cx">'+E(it)+'</div></div>'});h+='</div>';c.innerHTML+=h})}();

// Reminders
!function(){var c=document.getElementById('rml');D.REMINDERS.forEach(function(r){c.innerHTML+='<div class="ri">'+E(r)+'</div>'})}();

// Contacts
!function(){var c=document.getElementById('ctl');D.CONTACTS.forEach(function(ct){var h='<div class="cc"><div><div class="cn">'+E(ct.label)+'</div>';if(ct.note)h+='<div class="co">'+E(ct.note)+'</div>';h+='</div>';if(ct.tel)h+='<a class="cp" href="tel:'+E(ct.tel)+'">撥打</a>';h+='</div>';c.innerHTML+=h})}();

// Checkboxes
document.addEventListener('click',function(e){var i=e.target.closest('.ci');if(!i)return;i.classList.toggle('chk');sc(i.dataset.k,i.classList.contains('chk'))});

// Back top
window.addEventListener('scroll',function(){document.getElementById('bk').classList.toggle('show',window.scrollY>400)},{passive:true});

// Nav active
var nls=document.querySelectorAll('.nav a'),ss=[];nls.forEach(function(a){var id=a.getAttribute('href').slice(1),el=document.getElementById(id);if(el)ss.push({el:el,a:a})});
window.addEventListener('scroll',function(){var top=window.scrollY+80,cur=null;ss.forEach(function(s){if(s.el.offsetTop<=top)cur=s});nls.forEach(function(a){a.classList.remove('act')});if(cur)cur.a.classList.add('act')},{passive:true});
</script>
